name: ci

on:
  push:
  pull_request:
  # Inert until a merge queue is enabled on this repo; required for the
  # merge-queue measurement leg (no queue exists yet).
  merge_group:

permissions:
  pull-requests: write

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        suite: ["calc", "strings"]
    steps:
      - uses: actions/checkout@v4

      - id: ids
        run: |
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
          echo "wf=$(sha256sum .github/workflows/ci.yml | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # Same gate pattern as greenstamp's own ci workflow: the secrets
      # context is unusable in step `if:` expressions, so detect
      # configuration in shell once and gate on this step's output.
      # Inert (plain pytest runs) until both secrets exist.
      - id: gate
        run: |
          if [ -n "${{ secrets.GREENSTAMP_API_URL }}" ] && [ -n "${{ secrets.GREENSTAMP_CHECKOUT_TOKEN }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      # The greenstamp action lives in the private greenstamp repo, which this
      # workflow cannot `uses:` directly (GitHub runs actions only from the
      # same or a public repository), so check it out at a pinned SHA.
      # Re-pin deliberately; the SHA is part of the measurement record.
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          repository: aditi17goel/greenstamp
          ref: 8af9e52be2e86c8deed737fc161582136f5fa17c
          token: ${{ secrets.GREENSTAMP_CHECKOUT_TOKEN }}
          path: .greenstamp-action

      # Skip when this exact cell already passed. Matrix dimensions travel
      # in inputs/tool-versions so each of the 6 cells is a distinct job
      # identity; without them every cell would share one identity.
      - id: dedupe
        if: steps.gate.outputs.enabled == 'true'
        uses: ./.greenstamp-action
        with:
          api-url: ${{ secrets.GREENSTAMP_API_URL }}
          api-token: ${{ secrets.GREENSTAMP_API_TOKEN }}
          mode: decide
          workflow-sha: ${{ steps.ids.outputs.wf }}
          tree-sha: ${{ steps.ids.outputs.tree }}
          runner-label: ubuntu-latest
          inputs-json: '{"suite":"${{ matrix.suite }}"}'
          tool-versions-json: '{"python":"${{ matrix.python-version }}"}'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          pr-number: ${{ github.event.pull_request.number }}

      - id: timer_start
        if: steps.dedupe.outputs.verdict != 'skip'
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.dedupe.outputs.verdict != 'skip'
        with:
          python-version: ${{ matrix.python-version }}

      - run: pip install pytest
        if: steps.dedupe.outputs.verdict != 'skip'

      - run: pytest tests/test_${{ matrix.suite }}.py -q
        if: steps.dedupe.outputs.verdict != 'skip'

      - id: timer_stop
        if: always() && steps.dedupe.outputs.verdict != 'skip'
        run: |
          end=$(date +%s)
          start="${{ steps.timer_start.outputs.start }}"
          echo "duration=$((end - ${start:-$end}))" >> "$GITHUB_OUTPUT"

      - if: always() && steps.gate.outputs.enabled == 'true' && steps.dedupe.outputs.verdict != 'skip'
        uses: ./.greenstamp-action
        with:
          api-url: ${{ secrets.GREENSTAMP_API_URL }}
          api-token: ${{ secrets.GREENSTAMP_API_TOKEN }}
          mode: record
          workflow-sha: ${{ steps.ids.outputs.wf }}
          tree-sha: ${{ steps.ids.outputs.tree }}
          runner-label: ubuntu-latest
          inputs-json: '{"suite":"${{ matrix.suite }}"}'
          tool-versions-json: '{"python":"${{ matrix.python-version }}"}'
          commit-sha: ${{ github.sha }}
          passed: ${{ job.status == 'success' }}
          log-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          duration-s: ${{ steps.timer_stop.outputs.duration }}
